name: Daten pruefen

on:
  push:
    paths: ['public/data/**']
  pull_request:
    paths: ['public/data/**']

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python scripts/validate.py
