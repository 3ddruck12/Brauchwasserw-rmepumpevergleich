<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a5f8a'/%3E%3Cpath d='M9 22V10h3l4 7 4-7h3v12h-3v-6l-4 6-4-6v6z' fill='white'/%3E%3C/svg%3E" />
    <title>Brauchwasserwärmepumpen im Vergleich</title>
    <meta name="description" content="Vergleich von Brauchwasserwärmepumpen: Effizienz nach einheitlicher Messbasis, Preis, Wärmetauscher, Kesselmaterial und Anodenart." />
    <script>
      (function () {
        var t = localStorage.getItem('bwwp-theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
